
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMP-LINE</title>

<style>
/* ========================================
   TEMP-LINE
   Template Message Manager
======================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: #f4f6f9;
    color: #333;
}

/* HEADER */

header {
    height: 70px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #263746;
    color: white;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
}

.version {
    font-size: 12px;
    opacity: 0.7;
}

/* MAIN */

main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h2 {
    margin: 0 0 8px;
    font-size: 23px;
}

.welcome p {
    margin: 0;
    color: #777;
    font-size: 14px;
}

/* CONTENT */

.container {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 20px;
}

/* SIDEBAR */

.sidebar {
    background: white;
    border-radius: 8px;
    padding: 20px;
    min-height: 400px;
}

.sidebar h3 {
    margin: 0 0 15px;
    font-size: 15px;
}

.menu-item {
    padding: 12px;
    margin-bottom: 5px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.menu-item:hover {
    background: #f0f3f7;
}

.menu-item.active {
    background: #e8eef5;
    color: #263746;
    font-weight: bold;
}

/* WORK AREA */

.workspace {
    background: white;
    border-radius: 8px;
    padding: 25px;
    min-height: 400px;
}

.workspace h3 {
    margin-top: 0;
    font-size: 18px;
}

.placeholder {
    padding: 60px 20px;
    text-align: center;
    color: #999;
    border: 1px dashed #ddd;
    border-radius: 6px;
}

/* PAGE TITLE */

.page-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
}

.page-title img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}

/* REGISTER FORM */

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd3dc;
    border-radius: 5px;
    font-family: inherit;
    font-size: 14px;
    background: white;
}

.form-group textarea {
    min-height: 130px;
    resize: vertical;
    line-height: 1.6;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #507fa8;
    box-shadow: 0 0 0 2px rgba(80,127,168,0.12);
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.form-button {
    padding: 12px 30px;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
}

.save-button {
    background: #263746;
    color: white;
}

.save-button:hover {
    background: #3b5266;
}

.cancel-button {
    background: #e9edf1;
    color: #444;
}

.cancel-button:hover {
    background: #dce2e8;
}

.form-note {
    margin-top: 15px;
    font-size: 12px;
    color: #888;
}

/* FOOTER */

footer {
    padding: 20px;
    text-align: center;
    color: #999;
    font-size: 12px;
}

/* RESPONSIVE */

@media (max-width: 700px) {
    .container {
        grid-template-columns: 1fr;
    }

    main {
        padding: 15px;
    }

    .form-actions {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">TEMP-LINE</div>
    <div class="version">VERSION 0.1.0</div>
</header>

<main>

    <section class="welcome">
        <h2 class="page-title">
            <img src="./トータルロゴ.png" alt="TEMP-LINE ロゴ">
            定型文管理システム
        </h2>
        <p>Template Message Manager</p>
    </section>

    <div class="container">

        <!-- SIDEBAR -->

        <aside class="sidebar">
            <h3>MENU</h3>

            <div class="menu-item active" data-page="home">
                ホーム
            </div>

            <div class="menu-item" data-page="list">
                定型文一覧
            </div>

            <div class="menu-item" data-page="register">
                新規登録
            </div>

            <div class="menu-item" data-page="category">
                カテゴリー管理
            </div>

            <div class="menu-item" data-page="backup">
                バックアップ
            </div>

            <div class="menu-item" data-page="settings">
                設定
            </div>
        </aside>

        <!-- WORK AREA -->

        <section class="workspace" id="workspace">

            <h3>Welcome to TEMP-LINE</h3>

            <div class="placeholder">
                <p>定型文管理アプリ</p>
                <p>ここから管理機能を追加していきます。</p>
            </div>

        </section>

    </div>

</main>

<footer>
    TEMP-LINE © 2026
</footer>

<script>

/************************************************
 * TEMP-LINE
 * Template Message Manager
 * Version 0.1.0
 ************************************************/

"use strict";

const workspace = document.getElementById("workspace");
const menuItems = document.querySelectorAll(".menu-item");

// ホーム画面

function showHome() {

    workspace.innerHTML = `
        <h3>Welcome to TEMP-LINE</h3>

        <div class="placeholder">
            <p>定型文管理アプリ</p>
            <p>ここから管理機能を追加していきます。</p>
        </div>
    `;

}

// 新規登録画面

function showRegister() {

    workspace.innerHTML = `
        <h3>新規定型文登録</h3>

        <form id="registerForm">

            <div class="form-group">
                <label for="category">カテゴリー</label>
                <input
                    type="text"
                    id="category"
                    placeholder="カテゴリーを入力してください"
                    required
                >
            </div>

            <div class="form-group">
                <label for="title">タイトル</label>
                <input
                    type="text"
                    id="title"
                    placeholder="定型文のタイトルを入力してください"
                    required
                >
            </div>

            <div class="form-group">
                <label for="japanese">日本語</label>
                <textarea
                    id="japanese"
                    placeholder="日本語の文章を入力してください"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="thai">タイ語</label>
                <textarea
                    id="thai"
                    placeholder="タイ語の文章を入力してください"
                ></textarea>
            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="form-button save-button"
                >
                    保存
                </button>

                <button
                    type="button"
                    class="form-button cancel-button"
                    id="cancelButton"
                >
                    キャンセル
                </button>

            </div>

            <p class="form-note">
                ※ 保存機能は次の開発段階で実装します。
            </p>

        </form>
    `;

    // 保存ボタン（次の段階で保存処理を実装）

    document.getElementById("registerForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            alert("現在は登録画面の試作段階です。保存機能は次の段階で実装します。");

        });

    // キャンセル

    document.getElementById("cancelButton")
        .addEventListener("click", () => {

            showPage("home");

        });

}

// ページ切り替え

function showPage(page) {

    menuItems.forEach(item => {

        item.classList.toggle(
            "active",
            item.dataset.page === page
        );

    });

    if (page === "home") {
        showHome();
    }

    if (page === "register") {
        showRegister();
    }

}

// メニュー操作

menuItems.forEach(item => {

    item.addEventListener("click", () => {

        showPage(item.dataset.page);

    });

});

// 初期表示

document.addEventListener("DOMContentLoaded", () => {

    console.log("TEMP-LINE started.");

});

</script>

</body>
</html>
