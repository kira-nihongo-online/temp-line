<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMP-LINE</title>

<style>
/* ========================================
   TEMP-LINE
   Template Message Manager
======================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: #f4f6f9;
    color: #333;
}

/* HEADER */

header {
    height: 70px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #263746;
    color: white;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
}

.version {
    font-size: 12px;
    opacity: 0.7;
}

/* MAIN */

main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h2 {
    margin: 0 0 8px;
    font-size: 23px;
}

.welcome p {
    margin: 0;
    color: #777;
    font-size: 14px;
}

/* CONTENT */

.container {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 20px;
}

/* SIDEBAR */

.sidebar {
    background: white;
    border-radius: 8px;
    padding: 20px;
    min-height: 400px;
}

.sidebar h3 {
    margin: 0 0 15px;
    font-size: 15px;
}

.menu-item {
    padding: 12px;
    margin-bottom: 5px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.menu-item:hover {
    background: #f0f3f7;
}

.menu-item.active {
    background: #e8eef5;
    color: #263746;
    font-weight: bold;
}

/* WORK AREA */

.workspace {
    background: white;
    border-radius: 8px;
    padding: 25px;
    min-height: 400px;
}

.workspace h3 {
    margin-top: 0;
    font-size: 18px;
}

.placeholder {
    padding: 60px 20px;
    text-align: center;
    color: #999;
    border: 1px dashed #ddd;
    border-radius: 6px;
}

/* PAGE TITLE */

.page-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
}

.page-title img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}

/* REGISTER FORM */

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd3dc;
    border-radius: 5px;
    font-family: inherit;
    font-size: 14px;
    background: white;
}

.form-group textarea {
    min-height: 130px;
    resize: vertical;
    line-height: 1.6;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #507fa8;
    box-shadow: 0 0 0 2px rgba(80,127,168,0.12);
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.form-button {
    padding: 12px 30px;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
}

.save-button {
    background: #263746;
    color: white;
}

.save-button:hover {
    background: #3b5266;
}

.cancel-button {
    background: #e9edf1;
    color: #444;
}

.cancel-button:hover {
    background: #dce2e8;
}

.form-status {
    margin-top: 15px;
    font-size: 13px;
    color: #27865c;
}

/* DASHBOARD */

.dashboard-count {
    display: inline-flex;
    align-items: center;
    gap: 15px;
    padding: 20px 25px;
    border: 1px solid #e0e4e8;
    border-radius: 7px;
    margin-bottom: 20px;
}

.count-number {
    font-size: 32px;
    font-weight: bold;
    color: #263746;
}

/* TEMPLATE LIST */

.template-card {
    border: 1px solid #e0e4e8;
    border-radius: 7px;
    padding: 18px;
    margin-bottom: 15px;
}

.template-card h4 {
    margin: 0 0 10px;
    font-size: 17px;
}

.template-category {
    display: inline-block;
    background: #eaf0f6;
    color: #38546c;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 12px;
}

.template-language {
    font-size: 13px;
    font-weight: bold;
    color: #596b7c;
    margin: 12px 0 5px;
}

.template-message {
    padding: 12px;
    background: #f7f8fa;
    border-radius: 5px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.empty {
    padding: 60px 20px;
    text-align: center;
    color: #999;
    border: 1px dashed #ddd;
    border-radius: 6px;
}

/* FOOTER */

footer {
    padding: 20px;
    text-align: center;
    color: #999;
    font-size: 12px;
}

/* RESPONSIVE */

@media (max-width: 700px) {
    .container {
        grid-template-columns: 1fr;
    }

    main {
        padding: 15px;
    }

    .form-actions {
        flex-wrap: wrap;
    }
}

/* 定型文カードの操作ボタン */
.template-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid #eeeeee;
}

.template-action-button {
    padding: 8px 18px;
    border: 1px solid #dddddd;
    border-radius: 6px;
    background: #ffffff;
    color: #333333;
    font-size: 13px;
    cursor: pointer;
}

.template-action-button:hover {
    background: #f5f5f5;
}

/* コピー成功時の表示 */
.copy-button {
    background: #263746;
    color: white;
    border: 1px solid #263746;
}

.copy-button:hover {
    background: #3b5266;
}

</style>
</head>

<body>

<header>
    <div class="logo">TEMP-LINE</div>
    <div class="version">VERSION 0.1.0</div>
</header>

<main>

    <section class="welcome">
        <h2 class="page-title">
            <img src="./トータルロゴ.png" alt="TEMP-LINE ロゴ">
            定型文管理システム
        </h2>
        <p>Template Message Manager</p>
    </section>

    <div class="container">

        <!-- SIDEBAR -->

        <aside class="sidebar">
            <h3>MENU</h3>


            <div class="menu-item" data-page="list">
                定型文一覧
            </div>

            <div class="menu-item" data-page="register">
                新規登録
            </div>

            <div class="menu-item" data-page="category">
                カテゴリー管理
            </div>

            <div class="menu-item" data-page="backup">
                バックアップ
            </div>

            <div class="menu-item" data-page="settings">
                設定
            </div>
        </aside>

        <!-- WORK AREA -->

        <section class="workspace" id="workspace">
        </section>

    </div>

</main>

<footer>
    TEMP-LINE © 2026
</footer>

<script>

/************************************************
 * TEMP-LINE
 * Template Message Manager
 * Version 0.1.0
 ************************************************/

"use strict";

const workspace = document.getElementById("workspace");
const menuItems = document.querySelectorAll(".menu-item");

const STORAGE_KEY = "TEMP_LINE_TEMPLATES";

/************************************************
 * データ取得
 ************************************************/

function getTemplates() {

    try {

        const data = localStorage.getItem(STORAGE_KEY);

        if (!data) return [];

        const templates = JSON.parse(data);

        return Array.isArray(templates) ? templates : [];

    } catch (error) {

        console.error("データ取得エラー:", error);

        return [];

    }

}

/************************************************
 * データ保存
 ************************************************/

function saveTemplates(templates) {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(templates)
        );

        return true;

    } catch (error) {

        console.error("保存エラー:", error);

        return false;

    }

}

/************************************************
 * カテゴリー管理画面
 ************************************************/

function showCategory() {

    workspace.innerHTML = `
        <h3>カテゴリー管理</h3>

        <div class="form-group">
            <label for="newCategory">カテゴリー名</label>
            <input
                type="text"
                id="newCategory"
                placeholder="新しいカテゴリーを入力してください"
            >
        </div>

        <div class="form-actions">
            <button
                type="button"
                class="form-button save-button"
                id="addCategoryButton"
            >
                登録
            </button>
        </div>

        <p id="categoryStatus" class="form-status"></p>

        <h3>カテゴリー一覧</h3>

        <div id="categoryList">
            <div class="empty">
                カテゴリーはまだ登録されていません。
            </div>
        </div>
    `;

    document.getElementById("addCategoryButton")
        .addEventListener("click", () => {

            const input = document.getElementById("newCategory");
            const name = input.value.trim();
            const status = document.getElementById("categoryStatus");
            const categoryList = document.getElementById("categoryList");

            if (!name) {
                status.textContent = "カテゴリー名を入力してください。";
                return;
            }

            const item = document.createElement("div");
            item.className = "template-card";
            item.textContent = name;

            if (categoryList.querySelector(".empty")) {
                categoryList.innerHTML = "";
            }

            categoryList.appendChild(item);

            input.value = "";
            status.textContent = "カテゴリーを追加しました。";

        });

}

/************************************************
 * ホーム画面
 ************************************************/

function showHome() {

    const templates = getTemplates();

    workspace.innerHTML = `
        <h3>Welcome to TEMP-LINE</h3>

        <div class="dashboard-count">
            <div>
                <div style="font-size:13px;color:#777;">
                    登録済み定型文
                </div>
                <div class="count-number">
                    ${templates.length}
                    <span style="font-size:14px;">件</span>
                </div>
            </div>
        </div>

        <div class="placeholder">
            <p>定型文管理アプリ</p>
            <p>登録済みの定型文を管理できます。</p>
        </div>
    `;

}

/************************************************
 * 新規登録・編集画面
 ************************************************/

function showRegister(template = null) {

    workspace.innerHTML = `
        <h3>${template ? "定型文編集" : "新規定型文登録"}</h3>

        <form id="registerForm">

            <div class="form-group">
                <label for="category">カテゴリー</label>
                <input
                    type="text"
                    id="category"
                    placeholder="カテゴリーを入力してください"
                    required
                >
            </div>

            <div class="form-group">
                <label for="title">タイトル</label>
                <input
                    type="text"
                    id="title"
                    placeholder="定型文のタイトルを入力してください"
                    required
                >
            </div>

            <div class="form-group">
                <label for="japanese">日本語</label>
                <textarea
                    id="japanese"
                    placeholder="日本語の文章を入力してください"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="thai">タイ語</label>
                <textarea
                    id="thai"
                    placeholder="タイ語の文章を入力してください"
                ></textarea>
            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="form-button save-button"
                >
                    保存
                </button>

                <button
                    type="button"
                    class="form-button cancel-button"
                    id="cancelButton"
                >
                    キャンセル
                </button>

            </div>

            <p id="formStatus" class="form-status"></p>

        </form>
    `;

    // 編集対象の内容をフォームに表示
    if (template) {

        document.getElementById("category").value =
            template.category;

        document.getElementById("title").value =
            template.title;

        document.getElementById("japanese").value =
            template.japanese || "";

        document.getElementById("thai").value =
            template.thai || "";

    }

    // 保存処理
    document.getElementById("registerForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const updatedTemplate = {

                id: template ? template.id : crypto.randomUUID(),

                category: document.getElementById("category").value.trim(),

                title: document.getElementById("title").value.trim(),

                japanese: document.getElementById("japanese").value,

                thai: document.getElementById("thai").value,

                createdAt: template
                    ? template.createdAt
                    : new Date().toISOString()

            };

            if (!updatedTemplate.category || !updatedTemplate.title) {
                return;
            }

            const templates = getTemplates();

            if (template) {

                // 編集：元の定型文を更新
                const index = templates.findIndex(
                    item => item.id === template.id
                );

                if (index === -1) {
                    document.getElementById("formStatus")
                        .textContent = "編集対象が見つかりません。";
                    return;
                }

                templates[index] = updatedTemplate;

            } else {

                // 新規登録：新しい定型文を追加
                templates.push(updatedTemplate);

            }

            const saved = saveTemplates(templates);

            if (saved) {

                showPage("list");

            } else {

                document.getElementById("formStatus")
                    .textContent = "保存できませんでした。";

            }

        });

    // キャンセル
    document.getElementById("cancelButton")
        .addEventListener("click", () => {

            showPage("list");

        });

}

/************************************************
 * 定型文一覧
 ************************************************/

function showList() {

    const templates = getTemplates();

    workspace.innerHTML = `
        <h3>定型文一覧</h3>

        <div id="templateList"></div>
    `;

    const list = document.getElementById("templateList");

    if (templates.length === 0) {

        list.innerHTML = `
            <div class="empty">
                <p>登録された定型文はありません。</p>
                <p>「新規登録」から定型文を登録してください。</p>
            </div>
        `;

        return;

    }

    templates.forEach((template, index) => {

        const card = document.createElement("div");

        card.className = "template-card";

        const title = document.createElement("h4");
        title.textContent = template.title;

        const category = document.createElement("span");
        category.className = "template-category";
        category.textContent = template.category;

        const jpLabel = document.createElement("div");
        jpLabel.className = "template-language";
        jpLabel.textContent = "日本語";

        const jpMessage = document.createElement("div");
        jpMessage.className = "template-message";
        jpMessage.textContent = template.japanese || "（未入力）";

        const thLabel = document.createElement("div");
        thLabel.className = "template-language";
        thLabel.textContent = "タイ語";

        const thMessage = document.createElement("div");
        thMessage.className = "template-message";
        thMessage.textContent = template.thai || "（未入力）";

        card.append(
            title,
            category,
            jpLabel,
            jpMessage,
            thLabel,
            thMessage
        );

        // 操作ボタン
        const actions = document.createElement("div");
        actions.className = "template-actions";

        const editButton = document.createElement("button");
        editButton.className = "template-action-button";
        editButton.textContent = "編集";

        // 編集ボタンの処理
        editButton.addEventListener("click", () => {
            showPage("register", template);
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "template-action-button";
        deleteButton.textContent = "削除";

        // 削除ボタンの処理
        deleteButton.addEventListener("click", () => {
            const confirmed = confirm("この定型文を削除しますか？");

            if (!confirmed) {
                return;
            }

            // 登録データを取得
            const templates = getTemplates();

            // 選択した定型文だけを削除
            const updatedTemplates = templates.filter(
                item => item.id !== template.id
            );

            // 既存の保存関数で保存
            saveTemplates(updatedTemplates);

            // 一覧を再表示
            showList();
        });


        const jpCopyButton = document.createElement("button");
        jpCopyButton.className = "template-action-button copy-button";
        jpCopyButton.textContent = "日本語コピー";

        jpCopyButton.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(template.japanese || "");
                jpCopyButton.textContent = "コピー完了";
                setTimeout(() => {
                    jpCopyButton.textContent = "日本語コピー";
                }, 1500);
            } catch (error) {
                alert("コピーできませんでした。");
            }
        });

        const thCopyButton = document.createElement("button");
        thCopyButton.className = "template-action-button copy-button";
        thCopyButton.textContent = "タイ語コピー";

        thCopyButton.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(template.thai || "");
                thCopyButton.textContent = "コピー完了";
                setTimeout(() => {
                    thCopyButton.textContent = "タイ語コピー";
                }, 1500);
            } catch (error) {
                alert("コピーできませんでした。");
            }
        });

        actions.append(
            jpCopyButton,
            thCopyButton,
            editButton,
            deleteButton
        );


        card.append(
            title,
            category,
            jpLabel,
            jpMessage,
            thLabel,
            thMessage,
            actions
        );

        list.appendChild(card);

    });

}

/************************************************
 * ページ切り替え
 ************************************************/

function showPage(page, template = null) {

    menuItems.forEach(item => {

        item.classList.toggle(
            "active",
            item.dataset.page === page
        );

    });

    if (page === "register") {

        showRegister(template);

    } else if (page === "list") {

        showList();

    }
    
    else if (page === "category") {

        showCategory();

    }

}

/************************************************
 * メニュー操作
 ************************************************/

menuItems.forEach(item => {

    item.addEventListener("click", () => {

        showPage(item.dataset.page);

    });

});

/************************************************
 * 初期表示
 ************************************************/

document.addEventListener("DOMContentLoaded", () => {

    showPage("list");

    console.log("TEMP-LINE started.");

});

</script>

</body>
</html>
